<style amp-custom>

  /* ── ROOT VARIABLES ── */
  :root {
    --cyan:       #ffffff;
    --cyan-dim:   #ffffff;
    --cyan-glow:  rgba(255, 196, 0, 0.35);
    --cyan-faint: rgba(255, 174, 0, 0.08);
    --dark:       #1a1600;
    --dark-card:  rgba(38, 32, 0, 0.82);
    --dark-row:   rgba(60, 49, 0, 0.55);
    --border:     rgba(255, 230, 0, 0.25);
    --text:       #e0f7fa;
    --text-dim:   rgba(224, 247, 250, 0.6);
  }

  /* ── RESET ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO BACKGROUND ── */
  .hero-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .hero-bg amp-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(2px) brightness(0.35) saturate(1.4);
  }

  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(255, 217, 0, 0.12) 0%, transparent 50%),
      linear-gradient(225deg, rgba(200, 187, 0, 0.1) 0%, transparent 50%),
      radial-gradient(ellipse 80% 60% at 50% 20%, rgba(255, 196, 0, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255, 208, 0, 0.015) 3px,
        rgba(255, 217, 0, 0.015) 4px
      );
    pointer-events: none;
  }

  .overlay {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--dark-card);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px rgba(182, 180, 180, 0.1),
      0 0 40px rgba(184, 181, 181, 0.15),
      0 20px 60px rgba(0,0,0,0.7);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .topbar {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(90deg, rgba(40, 29, 0, 0.9), rgba(80, 68, 0, 0.9), rgba(40, 34, 0, 0.9));
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .topbar::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(187, 184, 184, 0.08) 40%,
      rgba(184, 182, 182, 0.14) 50%,
      rgba(170, 168, 168, 0.08) 60%,
      transparent 100%
    );
  }

  .topbar img {
    height: 44px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 0 8px var(--cyan));
  }

  /* ── CSS TAMBAHAN: PHISING NOTICE ── */
  .welcome {
    padding: 12px 15px;
    background: rgba(255, 208, 0, 0.08);
    border-bottom: 1px solid var(--border);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .welcome::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, transparent, #ffd90033, transparent);
    transform: skewX(-25deg);
    animation: kilatanNotice 4s infinite;
  }

  @keyframes kilatanNotice {
    0% { left: -150%; }
    30% { left: 150%; }
    100% { left: 150%; }
  }

  .welcome h3 {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 13px;
    color: #ffd04d;
    margin-bottom: 6px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ffd000;
    position: relative;
    z-index: 2;
  }

.welcome p {
    font-size: 12px;
    line-height: 1.5;
    text-align: center; /* Mengubah posisi teks ke tengah */
    margin: 0;
    position: relative;
    z-index: 2;
    color: #fff200; /* Warna kuning */
    font-weight: 700;
    animation: denyutKuning 1.5s infinite ease-in-out; /* Efek berdenyut */
    text-shadow: 0 0 8px rgba(255, 242, 0, 0.6);
  }

  /* CSS TAMBAHAN: ANIMASI DENYUT KUNING */
  .warning-pulse {
    color: #fff200;
    font-weight: 700;
    display: inline-block;
    animation: denyutKuning 1.5s infinite ease-in-out;
    text-shadow: 0 0 8px rgba(255, 242, 0, 0.6);
  }

  @keyframes denyutKuning {
    0%, 100% {
      color: #fff200;
      transform: scale(1);
    }
    50% {
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 242, 0, 1);
      transform: scale(1.02);
    }
  }

  .banner {

  .banner img {

/* Update pada pembungkus gambar */

}

  .info {

  .row {

    border-bottom: 1px solid rgba(255, 230, 0, 0.1);

  .row:last-child {

  .label {

  .value {

  .stats-grid {

  .stat-badge {

    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;

  .stat-label {
    font-family: 'Roboto Condensed', monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;

  .stat-value {

    font-size: 13px;

    color: var(--cyan);

  .footer {

  .footer a {

  .cyber-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), rgba(255, 187, 0, 0.3), transparent);
    margin: 10px 0;
    opacity: 0.5;
  }

</style>
