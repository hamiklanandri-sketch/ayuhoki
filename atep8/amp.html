        overflow: hidden;
        animation: fadeInUp 0.8s ease;

      /* Efek border laser emas */
      .container::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: conic-gradient(
          from 0deg,
          transparent,
          var(--gold-dark),
          var(--gold),
          var(--gold-light),
          var(--gold),
          var(--gold-dark),
          transparent
        );
        border-radius: 32px;
        z-index: -2;
        animation: rotateBorder 6s linear infinite;
      }
      
      .container::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: rgba(0, 0, 0, 0.95);
        border-radius: 28px;
        z-index: -1;
      }
      
      @keyframes rotateBorder {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
