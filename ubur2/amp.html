            border-radius: 10px;
        }

        .ygo-card-container {
            width: 100%;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), inset 0 0 5px rgba(255, 215, 0, 0.3);
            position: relative;
            transition: all 0.2s ease-out;
            box-sizing: border-box;
            overflow: hidden;
        }

        .ygo-card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150px;
            width: 100px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.4), transparent);
            transform: skewX(-25deg);
            z-index: 2;
            animation: card-shine 5s infinite;
            animation-delay: 1s;
        }

        @keyframes card-shine {
            0% { left: -150px; }
            25% { left: 110%; }
            100% { left: 110%; }
        }

        .hologram {
            width: 25px;
            height: 25px;
            background: linear-gradient(135deg, #ffd700, #b8860b, #ffd700, #daa520, #ffd700);
            background-size: 200% 200%;
            animation: holo-shine 3s linear infinite;
            border: 1px solid #ffd700;
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 10;
        }

        @keyframes holo-shine {
            0% { background-position: 100% 100%; }
            50% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .ygo-card-inner {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ffd700;
            position: relative;
            z-index: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(145deg, #000000, #1a1a1a, #000000);
            padding: 10px 15px;
            border-bottom: 2px solid #ffd700;
            box-shadow: inset 0 2px 2px rgba(255,215,0,0.2), inset 0 -2px 3px rgba(0,0,0,0.4);
        }

        .card-name {
            font-family: 'Matrix Regular Small Caps', sans-serif;
            font-size: 28px;
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            -webkit-background-clip: text;
            -moz-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -moz-text-fill-color: transparent;
            text-fill-color: transparent;
            text-shadow: 1px 1px 1px rgba(255,215,0,0.3);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card-attribute {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border: 2px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', sans-serif;
            font-size: 18px;
            color: #000;
            text-shadow: 1px 1px 1px rgba(255,215,0,0.5);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.7), 0 0 5px #ffd700;
            flex-shrink: 0;
        }

        .card-level {
            background: linear-gradient(145deg, #000000, #1a1a1a);
            padding: 5px 15px 8px 15px;
            box-shadow: inset 0 2px 2px rgba(255,215,0,0.2), inset 0 -2px 3px rgba(0,0,0,0.4);
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .star {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 50% 30%, #ffd700, #b8860b 70%);
            border-radius: 50%;
            margin-left: 3px;
            filter: drop-shadow(1px 1px 2px rgba(255,215,0,0.6));
            position: relative;
        }

        .star::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 30%, #fff7aa, #ffd700 70%);
            clip-path: polygon(50% 0%, 65% 40%, 100% 40%, 75% 65%, 85% 100%, 50% 80%, 15% 100%, 25% 65%, 0% 40%, 35% 40%);
            transform: scale(0.9);
        }

        .rating-count {

            font-size: 16px;
            font-weight: 600;
            color: #ffd700;
            text-shadow: 1px 1px 1px rgba(255,215,0,0.3);
            margin-left: 10px;
        }

        .card-image-box {

            background: #1a1a1a;
        }

        .card-image-placeholder {
            width: 100%;
            overflow: hidden;
            border-radius: 5px;
            position: relative;
            border-style: solid;
            border-width: 6px;
            border-color: #000000 #ffd700 #ffd700 #000000;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .card-type {
            background: #000000;
            padding: 5px 15px;
            border-top: 2px solid #ffd700;
            border-bottom: 2px solid #ffd700;
        }

        .type-text {
            font-family: 'Matrix Regular Small Caps', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: #ffd700;
        }

        .card-body {
            background: #000000;
            padding: 15px;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .card-description {
            font-family: 'EB Garamond', serif;
            font-size: 15px;
            color: #ffd700;
            line-height: 1.4;
            font-style: italic;
        }

        .card-description strong {
            font-style: normal;
            font-weight: bold;
            color: #fff;
        }

        .card-cta-button {
            display: block;
            width: 80%;
            margin: 15px auto 10px auto;
            padding: 12px;
            background: linear-gradient(145deg, #ffd700, #b8860b);
            color: #000000;
            font-family: 'Matrix Regular Small Caps', sans-serif;
            font-size: 18px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(255,215,0,0.4);
            font-weight: bold;
        }

        .card-description + .card-cta-button {
            margin-top: 20px;
        }

        .card-cta-button:hover {
            background: linear-gradient(145deg, #fff068, #ffd700);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.5);
            transform: translateY(-2px);
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 15px;
            background: linear-gradient(145deg, #000000, #1a1a1a);
            border-top: 2px solid #ffd700;
            padding-right: 50px;

        }

        @media (max-width: 480px) {

            .card-scene { width: 100%; margin: 15px 0; }

            .card-image-box { padding: 5px; }
            .card-description { font-size: 14px; }
            .card-body { padding: 12px; }
            .card-cta-button { font-size: 16px; padding: 10px; width: 90%; }

            .card-footer { padding-right: 40px; }
            .hologram { right: 12px; bottom: 12px; width: 20px; height: 20px; }

            /* Responsive effects */
            .firework-launcher-1 { left: 5%; }
            .firework-launcher-2 { right: 5%; }
            .firework-launcher-3 { left: 50%; }
            .card-scene::before { font-size: 18px; letter-spacing: 10px; top: -25px; }
            .card-scene::after { font-size: 16px; letter-spacing: 8px; bottom: -25px; }
        }
    </style>
</head>
